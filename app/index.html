<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>截图拼接 · 网页版</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="hero">
  <div class="hero-inner">
    <h1>点一下，把截图拼成一张</h1>
    <div id="status" class="status">点击屏幕任意处，选择多张截图</div>
    <div class="opts">
      <button type="button" data-blend="seam" class="on">接缝</button>
      <button type="button" data-blend="mean">平均</button>
      <button type="button" data-blend="median">中值</button>
    </div>
    <div id="result"></div>
    <a class="down" href="#examples">示例 ↓</a>
  </div>
</section>

<section id="examples">
  <div class="wrap">
    <div id="cards"></div>
    <p class="back"><a href="../index.html">← 主页面</a> · <a href="../report.html">技术报告</a></p>
  </div>
</section>

<input id="file" type="file" accept="image/*" multiple hidden>
<script src="stitch.js"></script>
<script src="stitch_full.js"></script>
<script src="app.js"></script>
</body>
</html>
