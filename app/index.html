<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>截图拼接 · 极简网页版</title>
<meta name="description" content="纯平移镜头截图拼接，全部在浏览器本地计算，无需上传。">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="hero">
  <div class="hero-inner">
    <div class="brand">Anime Screenshot Collage <span>/ web</span></div>
    <h1>点一下，把截图拼成一张</h1>
    <p class="lede">纯平移镜头 · 全部在浏览器里算 · 图片不会上传</p>

    <div id="status" class="status">点击屏幕任意处，选择多张截图</div>

    <div class="opts">
      <span>融合</span>
      <button type="button" data-blend="mean" class="on">平均（羽化）</button>
      <button type="button" data-blend="median">中值（去运动物体 / 重复水印）</button>
    </div>

    <div id="result"></div>
    <div id="diag" class="diag"></div>

    <a class="down" href="#examples">向下滑动，看三组示例的输入输出实测 ↓</a>
  </div>
</section>

<section id="examples">
  <div class="wrap">
    <h2>三组示例 · 输入输出实测</h2>
    <p class="muted">点「运行」，网页会用这些输入图重新算一遍；右侧是 Python 完整版（含 LaMa 清理）的参考输出，用来对照。极简版不含 LaMa，斜向运镜边缘会有补洞痕迹。</p>
    <div id="cards"></div>
    <p class="back"><a href="../index.html">← 回到对话存档主页面</a> · <a href="../report.html">技术报告</a></p>
  </div>
</section>

<input id="file" type="file" accept="image/*" multiple hidden>
<script src="stitch.js"></script>
<script src="app.js"></script>
</body>
</html>
