name: Enable GitHub Pages

# 细粒度 PAT 没有 pages:write 权限，无法直接调用 Pages API；
# 借仓库自带 GITHUB_TOKEN（显式声明 pages: write）在推送后自动开启。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from main / root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{"source":{"branch":"main","path":"/"}}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          echo "POST /pages -> ${code}"
          cat /tmp/pages.json || true
          # 201=已开启, 409/422=已存在, 均视为成功
          case "${code}" in
            201|204|409|422) echo "Pages OK"; exit 0 ;;
            *) echo "Pages API 不可用，请在 Settings → Pages 手动选择 main / root"; exit 1 ;;
          esac
